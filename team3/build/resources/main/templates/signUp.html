<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/signUp.js}"></script>
    <link th:href="@{/css/signUp.css}" rel="stylesheet">
    <title>회원가입 페이지</title>
</head>
<body>
<div class="container">
    <a href="https://www.naver.com" class="logo">Team3</a>
    <form class="signup-form">
        <label for="name">이름:</label>
        <input type="text" placeholder ="이름을 입력하세요." id="name" name="name" required>

        <label for="phone">전화번호:</label>
        <input type="tel" placeholder ="전화번호를 입력하세요." id="phone" name="phone" required>

        <label for="email">이메일:</label>
        <input type="email" placeholder ="이메일을 입력하세요." id="email" name="email" required>

        <label for="username">아이디:</label>
        <input type="text" placeholder ="아이디를 입력하세요." id="username" name="username" required>

        <label for="password">비밀번호:</label>
        <input type="password" placeholder ="비밀번호를 입력하세요." id="password" name="password" required>

        <label for="address">배송지:</label>
        <input type="text" placeholder ="배송지를 입력하세요." id="address" name="address" required>

        <button type="submit">회원가입</button>
    </form>
</div>
</body>
</html>
