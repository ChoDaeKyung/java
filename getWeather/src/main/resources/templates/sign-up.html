<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
  <script th:src="@{/js/sign-up.js}"></script>
  <title>회원가입</title>
  <link rel="stylesheet" th:href="@{/css/sign-up.css}"> <!-- CSS 파일 링크 -->
</head>
<body>
<div class="center-container">
  <div class="signup-box">
    <h2>회원가입</h2>
    <form method="post">
      <div class="input-group">
        <input type="text" id="username" placeholder="이름" required>
      </div>
      <div class="input-group">
        <input type="text" id="email" placeholder="이메일" required>
      </div>
      <div class="input-group">
        <input type="text" id="phone" placeholder="전화번호" required>
      </div>
      <div class="input-group">
        <input type="text" id="userid" placeholder="아이디" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="비밀번호" required>
      </div>
      <button type="submit" id="signup" class="signup-btn">회원가입</button>
    </form>
    <p class="login-text">이미 계정이 있으신가요? <a th:href="@{/weather/login}" class="login-link">로그인하기</a></p>
  </div>
</div>
</body>
</html>
